name: MIR4 NFT Scraper

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Impede que dois runs (ex: o agendado + um manual) corram ao mesmo tempo e colidam no
# git push. Se um novo run começar enquanto outro ainda está a decorrer, fica em fila em
# vez de correr em paralelo e rebentar com "cannot lock ref".
concurrency:
  group: scraper-run
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scraper.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0

          git commit -m "data: update $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Rede de segurança extra, mesmo com concurrency: se o push for rejeitado por o
          # remoto ter avançado entretanto, tenta rebase + push outra vez (até 5x) em vez
          # de falhar o run e perder os dados recolhidos.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push OK"
              exit 0
            fi
            echo "Push falhou (tentativa $i/5), a tentar rebase..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Push falhou depois de 5 tentativas"
          exit 1
